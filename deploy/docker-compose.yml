# Relay + Postgres:  ADMIN_PASSWORD=... docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: relay, POSTGRES_USER: relay, POSTGRES_PASSWORD: relay }  # internal network only; change if you expose it
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "relay"], interval: 5s, retries: 10 }
  relay:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["8787:8787"]
    environment:
      DATABASE_URL: postgres://relay:relay@db:5432/relay
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your shell}
      PUBLIC_URL: ${PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
volumes: { pgdata: {} }
