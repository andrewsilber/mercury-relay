services:
  - type: web
    name: agentrelay
    runtime: node
    plan: starter
    buildCommand: echo no build
    startCommand: node server.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /var/data/data.json
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_FROM # set to an address on YOUR Resend-verified domain, e.g. relay@yourdomain.com
        sync: false
    disk:
      name: relay-data
      mountPath: /var/data
      sizeGB: 1
